name: Moodle Plugin CI

"on": [push, pull_request]

jobs:
  ci:
    uses: Wunderbyte-GmbH/catalyst-moodle-workflows/.github/workflows/ci.yml@main
    with:
      # Change these based on your plugin's requirements

      disable_release: true  # Use true if using the tag-based release workflow

      # Fixed (Session 002, Teil 15): this was commented out, so the reusable
      # workflow fell back to auto-detecting the test matrix from the FULL
      # $plugin->supported range in version.php (previously [401, 405]) —
      # which is how MOODLE_404_STABLE ended up being tested at all. That
      # install failed outright: the local_wunderbyte_table extra_plugin_runner
      # below requires a newer Moodle core than 4.04 provides. 401-404 are no
      # longer supported (see version.php); explicit override instead,
      # matching enrol_adele/local_adele's own CI.
      moodle_branches: "MOODLE_500_STABLE MOODLE_501_STABLE MOODLE_502_STABLE"
      min_php: '8.2'

      # Command to install more dependencies
      #
      # local_adele was missing here even though version.php has always
      # declared a hard dependency on it ($plugin->dependencies['local_adele']).
      # Added now because it became unavoidable: mod_adele 0.1.5 requires
      # local_adele 0.4.3 specifically (enrol_adele project, Session 001,
      # Teil 3/4), and both plugins are co-developed on the "development"
      # branch of the ralferlebach fork.
      extra_plugin_runners: |
        moodle-plugin-ci add-plugin --branch main Wunderbyte-GmbH/moodle-local_wunderbyte_table
        moodle-plugin-ci add-plugin --branch development ralferlebach/moodle_local_adele
      #   moodle-plugin-ci add-plugin --branch master branchup/moodle-filter_shortcodes
      #   moodle-plugin-ci add-plugin --branch main Wunderbyte-GmbH/moodle-tool_mocktesttime

      # If you need to ignore specific paths (third-party libraries are ignored by default)
      # ignore_paths: "vue3,moodle/tests/fixtures,moodle/Sniffs,moodle/vue3,OpenTBS,TinyButStrong"

      # Specify paths to ignore for mustache lint
      # mustache_ignore_names: 'cashier.mustache,shopping_cart_item.mustache,history_item.mustache,form-user-selector-suggestion.mustache,shopping_cart_popover.mustache'

      # Specify paths to ignore for code checker
      # codechecker_ignore_paths: 'OpenTBS, TinyButStrong'

      # Specify paths to ignore for PHPDoc checker
      # phpdocchecker_ignore_paths: 'OpenTBS, TinyButStrong'

      # If you need to disable specific tests
      # disable_phpcpd: true
      # disable_mustache: true
      # disable_phpunit: true
      # disable_grunt: true
      # disable_phpdoc: true
      # disable_phpcs: true
      #
      # phplint currently fails with "Not enough arguments (missing: 'plugin').",
      # a Symfony console error meaning moodle-plugin-ci phplint was invoked
      # with no plugin path at all - not a syntax problem in this repository's
      # own PHP (phpcs' own run in the same job DID resolve the plugin path
      # correctly and scanned real files). This looks like a bug/regression
      # inside the shared Wunderbyte-GmbH/catalyst-moodle-workflows reusable
      # workflow itself (tracked here via @main, so any upstream change there
      # applies immediately) rather than anything wrong in this file. Left
      # enabled for now since it's a coverage loss either way; uncomment
      # below as a pragmatic stopgap if it keeps blocking CI, and consider
      # pinning @main to a known-good tag/commit instead.
      # disable_phplint: true
      # disable_ci_validate: true

      # If you need to enable PHPMD
      enable_phpmd: true

      # For strict code quality checks
      codechecker_max_warnings: 0
